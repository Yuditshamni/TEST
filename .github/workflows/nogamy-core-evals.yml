# Core repo only. Runs the skill evals (nogamy/evals/README.md). Called by nogamy-core-ci (changed skills)
# and nogamy-core-release (all). No ANTHROPIC_API_KEY secret → skipped with a notice, never silently green.
name: nogamy-core-evals

on:
  workflow_call:
    inputs:
      only_changed:
        type: boolean
        default: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    if: vars.NOGAMY_IS_CORE_REPO == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Key present?
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::warning::ANTHROPIC_API_KEY is not set: evals skipped (nogamy/docs/setup.md)"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: Run evals
        if: steps.key.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install --quiet anthropic
          if [ "${{ inputs.only_changed }}" = "true" ] && [ -n "${{ github.base_ref }}" ]; then
            python3 nogamy/evals/run_evals.py --changed "origin/${{ github.base_ref }}"
          else
            python3 nogamy/evals/run_evals.py
          fi
      - uses: actions/upload-artifact@v6
        if: always() && steps.key.outputs.skip != 'true'
        with:
          name: eval-results
          path: nogamy/evals/out/
